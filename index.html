<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Арина | Official Bio</title>
    <style>
        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #6d28d9 0%, #1e1b4b 100%);
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: white;
            padding-bottom: 140px; 
        }

        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 40px 25px;
            border-radius: 35px;
            text-align: center;
            width: 85%;
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }

        .profile-img {
            width: 140px; height: 140px;
            border-radius: 50%;
            border: 3px solid #c084fc;
            object-fit: cover;
            filter: drop-shadow(0 0 15px rgba(192, 132, 252, 0.5));
            margin-bottom: 20px;
        }

        .date-badge {
            background: rgba(192, 132, 252, 0.2);
            color: #f0abfc;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 15px;
            border: 1px solid rgba(240, 171, 252, 0.3);
        }

        h1 { margin: 10px 0; font-size: 32px; letter-spacing: 1px; }
        .username { color: #d8b4fe; font-size: 16px; margin-bottom: 25px; display: block; }

        .info-row {
            background: rgba(0, 0, 0, 0.3);
            margin: 10px 0; padding: 15px;
            border-radius: 18px; font-size: 16px;
            display: flex; align-items: center; gap: 15px;
            transition: 0.3s;
        }

        .info-row:hover { transform: translateX(5px); background: rgba(255, 255, 255, 0.1); }

        .insta-btn {
            display: block; margin-top: 30px; padding: 15px;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white; text-decoration: none; border-radius: 15px; font-weight: bold;
        }

        .quote { font-style: italic; opacity: 0.8; margin-top: 20px; font-size: 14px; }

        /* شريط الألبومات السفلي */
        .music-dock {
            position: fixed; bottom: 15px; left: 50%;
            transform: translateX(-50%);
            width: 90%; max-width: 400px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(25px);
            border-radius: 25px; padding: 15px;
            display: flex; justify-content: space-around;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }

        .album-box { text-align: center; cursor: pointer; transition: 0.2s; }
        .album-art {
            width: 65px; height: 65px;
            border-radius: 12px; margin-bottom: 5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            object-fit: cover;
        }
        .playing { 
            border: 2px solid #f0abfc; 
            box-shadow: 0 0 15px #f0abfc; 
            transform: scale(1.1); 
        }
        audio { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://iili.io/qf4hLSR.jpg" alt="Arina" class="profile-img">
        <div class="date-badge">June 6, 2011 🕊️</div>
        <h1>Арина</h1>
        <span class="username">@arinwjh</span>
        <div class="info-row">☦️ <span>Orthodox Christian</span></div>
        <div class="info-row">🎵 <span>A$AP Rocky Vibes</span></div>
        <div class="info-row">🥘 <span>Chicken Julienne Lover</span></div>
        <p class="quote">"Jesus Christ loves you" ✨</p>
        <a href="https://www.instagram.com/arinwjh?igsh=b29mYmEwM29mZmty" class="insta-btn">Follow me on Instagram</a>
    </div>

    <div class="music-dock">
        <div class="album-box" onclick="handleMusic('58xKTGxmeHI.mp3', this)">
            <img src="https://i.ibb.co/xKjb0Y2c/IMG-20260228-121928.jpg" class="album-art">
            <div style="font-size: 10px;">Hope</div>
        </div>
        <div class="album-box" onclick="handleMusic('pgN-vvVVxMA.mp3', this)">
            <img src="https://i.ibb.co/xKjb0Y2c/IMG-20260228-121928.jpg" class="album-art">
            <div style="font-size: 10px;">SAD!</div>
        </div>
        <div class="album-box" onclick="handleMusic('5qm8PH4xAss.mp3', this)">
            <img src="https://i.ibb.co/M5P730GQ/3389143a3e12456fc07deb03fd3225a7-1000x1000x1.png" class="album-art">
            <div style="font-size: 10px;">50 Cent</div>
        </div>
    </div>

    <audio id="audio-player" preload="auto"></audio>

    <script>
        const player = document.getElementById('audio-player');
        let currentFile = "";

        function handleMusic(fileName, element) {
            const art = element.querySelector('.album-art');

            // إيقاف وتشغيل نفس الأغنية
            if (currentFile === fileName) {
                if (player.paused) {
                    player.play();
                    art.classList.add('playing');
                } else {
                    player.pause();
                    art.classList.remove('playing');
                }
                return;
            }

            // تبديل الأغنية وإيقاف القديمة
            document.querySelectorAll('.album-art').forEach(img => img.classList.remove('playing'));
            player.src = fileName;
            player.play().then(() => {
                art.classList.add('playing');
                currentFile = fileName;
            }).catch(e => {
                // محاولة أخرى في حالة قيود المتصفح
                player.play();
            });
        }

        // كود التحميل المسبق السريع
        window.addEventListener('load', () => {
            const tracks = ['58xKTGxmeHI.mp3', 'pgN-vvVVxMA.mp3', '5qm8PH4xAss.mp3'];
            tracks.forEach(track => {
                const link = document.createElement('link');
                link.rel = 'preload';
                link.as = 'audio';
                link.href = track;
                document.head.appendChild(link);
            });
        });
    </script>

</body>
</html>
