<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Арина | Official Bio</title>
    <style>
        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            /* خلفية بربل نيون متدرجة */
            background: radial-gradient(circle at center, #6d28d9 0%, #1e1b4b 100%);
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: white;
        }

        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 40px 25px;
            border-radius: 35px;
            text-align: center;
            width: 85%;
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }

        .profile-img {
            width: 140px; height: 140px;
            border-radius: 50%;
            border: 3px solid #c084fc;
            object-fit: cover;
            /* توهج حول الصورة */
            filter: drop-shadow(0 0 15px rgba(192, 132, 252, 0.5));
            margin-bottom: 20px;
        }

        h1 { margin: 10px 0; font-size: 32px; letter-spacing: 1px; }
        .username { color: #d8b4fe; font-size: 16px; margin-bottom: 25px; display: block; }

        .info-row {
            background: rgba(0, 0, 0, 0.3);
            margin: 10px 0;
            padding: 15px;
            border-radius: 18px;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.3s;
        }

        .info-row:hover { transform: translateX(5px); background: rgba(255, 255, 255, 0.1); }

        .insta-btn {
            display: block;
            margin-top: 30px;
            padding: 15px;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white;
            text-decoration: none;
            border-radius: 15px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .quote { font-style: italic; opacity: 0.8; margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://iili.io/qf4hLSR.jpg" alt="Arina" class="profile-img">
        
        <h1>Арина</h1>
        <span class="username">@arinwjh</span>

        <div class="info-row">☦️ <span>Orthodox Christian</span></div>
        
        <div class="info-row">🎵 <span>A$AP Rocky Vibes</span></div>
        
        <div class="info-row">🥘 <span>Chicken Julienne Lover</span></div>

        <p class="quote">"Jesus Christ loves you" ✨</p>

        <a href="https://www.instagram.com/arinwjh?igsh=b29mYmEwM29mZmty" class="insta-btn">Follow me on Instagram</a>
    </div>

</body>
</html>
